<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Surpresa🩷">
    <title>Surpresa Isa! 🩷</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- CANVAS FOR CONFETTI + STARS -->
    <canvas id="particleCanvas"></canvas>

    <!-- AURORA BLOBS -->
    <div class="aurora-wrap" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- FLOATING MUSIC CONTROLLER -->
    <button id="musicCtrlBtn" class="music-ctrl-btn" aria-label="Tocar música de fundo">
        <span class="music-icon" id="musicIcon">🎵</span>
    </button>
    <audio id="bgMusic" src="music.mp3"></audio>

    <!-- MAIN CARD -->
    <main class="card" role="main">

        <!-- BADGE TOP -->
        <div class="badge" aria-hidden="true">
            <span>🩷</span>
            <span class="badge-text">Faltam pouquinhos dias!</span>
            <span>🩷</span>
        </div>

        <!-- TITLE -->
        <header class="card-header">
            <h1 class="title">Isa faz anos!</h1>
            <p class="date-target">1° de Novembro 🎂</p>
        </header>

        <!-- DIVIDER -->
        <div class="divider" aria-hidden="true">
            <span class="divider-line"></span>
            <span class="divider-icon">✦</span>
            <span class="divider-line"></span>
        </div>

        <!-- COUNTDOWN -->
        <section class="countdown-section" aria-label="Contagem regressiva">
            <div class="countdown" id="countdown">
                <div class="time-unit">
                    <div class="time-box" id="box-days">
                        <span class="time-num" id="days">00</span>
                    </div>
                    <span class="label">Dias</span>
                </div>
                <div class="separator" aria-hidden="true">:</div>
                <div class="time-unit">
                    <div class="time-box" id="box-hours">
                        <span class="time-num" id="hours">00</span>
                    </div>
                    <span class="label">Horas</span>
                </div>
                <div class="separator" aria-hidden="true">:</div>
                <div class="time-unit">
                    <div class="time-box" id="box-minutes">
                        <span class="time-num" id="minutes">00</span>
                    </div>
                    <span class="label">Minutos</span>
                </div>
                <div class="separator" aria-hidden="true">:</div>
                <div class="time-unit">
                    <div class="time-box" id="box-seconds">
                        <span class="time-num" id="seconds">00</span>
                    </div>
                    <span class="label">Segundos</span>
                </div>
            </div>
        </section>

        <!-- DIVIDER -->
        <div class="divider" aria-hidden="true">
            <span class="divider-line"></span>
            <span class="divider-icon">✦</span>
            <span class="divider-line"></span>
        </div>

        <!-- ROTATING FUN PHRASES -->
        <section class="phrase-section" aria-live="polite">
            <p class="phrase" id="birthdayPhrase"></p>
        </section>

        <!-- LIVE SUBTITLES (visible when music is playing) -->
        <div id="liveSubtitles" class="live-subtitles">
            <p class="sub-en" id="subEn">Clique no 🎵 no topo para começar a música!</p>
            <p class="sub-pt" id="subPt">Clique no 🎵 no topo para iniciar a música!</p>
        </div>

        <!-- LYRICS TOGGLE BUTTON & CONTENT -->
        <section class="lyrics-section">
            <button id="toggleLyricsBtn" class="lyrics-btn" aria-expanded="false" aria-controls="lyricsContent">
                Ver Letra da Música 🎵
            </button>
            <div id="lyricsContent" class="lyrics-content hidden">
                <div class="lyrics-container-inner" id="lyricsContainerInner">
                    <!-- Javascript will render synced rows here -->
                </div>
            </div>
        </section>

        <!-- FOOTER — CAKE PULSE -->
        <footer class="card-footer">
            <div class="cake-wrap" aria-hidden="true">
                <div class="cake-glow"></div>
                <span class="big-cake" id="cakeEmoji">🎂</span>
            </div>
        </footer>

    </main>

    <script src="script.js"></script>
</body>

</html>
